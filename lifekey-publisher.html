<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>LifeKey Publisher</title><style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f6f8;
        margin: 0;
        padding: 20px;
    }

    .container {
        max-width: 800px;
        margin: auto;
        background: white;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h1 {
        margin-top: 0;
        color: #222;
    }

    label {
        display: block;
        margin-top: 18px;
        margin-bottom: 6px;
        font-weight: bold;
    }

    input,
    select,
    textarea {
        width: 100%;
        box-sizing: border-box;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 7px;
        font-size: 16px;
    }

    textarea {
        min-height: 180px;
        resize: vertical;
    }

    button {
        margin-top: 20px;
        padding: 12px 18px;
        border: none;
        border-radius: 7px;
        font-size: 16px;
        cursor: pointer;
    }

    #publishBtn {
        background: #111;
        color: white;
    }

    #clearBtn {
        background: #ddd;
        color: #111;
        margin-left: 8px;
    }

    #status {
        margin-top: 20px;
        padding: 12px;
        border-radius: 7px;
        display: none;
        white-space: pre-wrap;
        word-break: break-word;
    }

    .success {
        background: #e8f7e8;
        color: #176b17;
    }

    .error {
        background: #ffe8e8;
        color: #9b111e;
    }
</style></head><body><div class="container"><h1>LifeKey Publisher</h1>

<p>Create and publish a new LifeKey Hub article.</p>

<label for="password">Publisher Password</label>
<input
    type="password"
    id="password"
    placeholder="Enter publisher password"
    autocomplete="off"
>

<label for="category">Category</label>
<select id="category">
    <option value="general">General LifeKey Article</option>
    <option value="money">Money & Opportunity</option>
    <option value="business">Business & Technology</option>
    <option value="ai">AI & Artificial Intelligence</option>
    <option value="freelancing">Freelancing</option>
    <option value="digital-products">Digital Products</option>
    <option value="trading-investing">Trading & Investing</option>
    <option value="real-estate">Real Estate</option>
    <option value="innovation">Innovation</option>
</select>

<label for="title">Article Title</label>
<input
    type="text"
    id="title"
    placeholder="Enter article title"
>

<label for="description">Description</label>
<textarea
    id="description"
    style="min-height:100px;"
    placeholder="Short description of the article"
></textarea>

<label for="content">Article Content</label>
<textarea
    id="content"
    placeholder="Write your full article here..."
></textarea>

<button id="publishBtn">Publish Article</button>
<button id="clearBtn" type="button">Clear</button>

<div id="status"></div>

</div><script>

const publishBtn = document.getElementById("publishBtn");
const clearBtn = document.getElementById("clearBtn");
const statusBox = document.getElementById("status");

function showStatus(message, type) {
    statusBox.style.display = "block";
    statusBox.className = type;
    statusBox.textContent = message;
}

publishBtn.addEventListener("click", async function () {

    const password = document.getElementById("password").value.trim();
    const category = document.getElementById("category").value;
    const title = document.getElementById("title").value.trim();
    const description = document.getElementById("description").value.trim();
    const content = document.getElementById("content").value.trim();

    if (!password) {
        showStatus("Please enter the publisher password.", "error");
        return;
    }

    if (!title) {
        showStatus("Please enter an article title.", "error");
        return;
    }

    if (!content) {
        showStatus("Please enter the article content.", "error");
        return;
    }

    publishBtn.disabled = true;
    publishBtn.textContent = "Publishing...";

    showStatus("Connecting to LifeKey publishing server...", "");

    try {

        const response = await fetch("/api/publish", {
            method: "POST",

            headers: {
                "Content-Type": "application/json",
                "X-Publisher-Password": password
            },

            body: JSON.stringify({
                category: category,
                title: title,
                description: description,
                content: content
            })
        });

        const responseText = await response.text();

        let data;

        try {
            data = JSON.parse(responseText);
        } catch (jsonError) {

            showStatus(
                "SERVER RESPONSE (not JSON)\n\n" +
                "HTTP Status: " + response.status + "\n\n" +
                responseText,
                "error"
            );

            return;
        }

        if (response.ok && data.success) {

            showStatus(
                "Article published successfully!\n\n" +
                (data.message || "The article was created."),
                "success"
            );

        } else {

            showStatus(
                "PUBLISHING FAILED\n\n" +
                "HTTP Status: " + response.status + "\n\n" +
                (data.error || data.message || JSON.stringify(data, null, 2)),
                "error"
            );
        }

    } catch (error) {

        showStatus(
            "CONNECTION ERROR\n\n" +
            error.message,
            "error"
        );

    } finally {

        publishBtn.disabled = false;
        publishBtn.textContent = "Publish Article";
    }

});

clearBtn.addEventListener("click", function () {

    document.getElementById("title").value = "";
    document.getElementById("description").value = "";
    document.getElementById("content").value = "";

    showStatus("", "");

    statusBox.style.display = "none";
});

</script></body>
</html>
